[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "site-converter"
version = "1.0.0"
description = "A Python tool to make any website available offline."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "İbrahim Emir Akman" }
]
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.1",
    "lxml>=5.0.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
site-converter = "site_converter.cli:main"