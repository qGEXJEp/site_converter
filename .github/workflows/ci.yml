name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python 3.11 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Bağımlılıkları ve Linter'ı Kur
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Flake8 ile Kod Kalitesi Denetimi (Linting)
      run: |
        # Kritik sözdizimi hatalarını (syntax errors) ve tanımsız değişkenleri yakala. Hata varsa süreci patlat.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Kodun karmaşıklığını ve stilini ölç. (Uyarı seviyesinde tut)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
